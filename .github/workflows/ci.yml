name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Strict build
        run: bash scripts/build.sh strict

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: bash scripts/test.sh unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Integration tests
        run: bash scripts/test.sh integration

      - name: Benchmark smoke test
        run: bash scripts/test.sh benchmark

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ASan and UBSan tests
        run: bash scripts/test.sh sanitizer
